<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>FilmPicker · GRKit</title>
  
  <!-- Ustawienia PWA dla iOS -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="FilmPicker">
  <meta name="theme-color" content="#0d0d0f">
  
  <link rel="manifest" href="./manifest.json">
  <link rel="apple-touch-icon" href="./icon.svg">
  <link rel="icon" type="image/svg+xml" href="./icon.svg">

  <style>
    :root {
      --bg: #0d0d0f;
      --surface: #18181c;
      --surface-active: #24242b;
      --border: #2c2c35;
      --text: #f4f4f6;
      --text-muted: #9898a6;
      --accent: #f59e0b; /* Kodak Amber */
      --accent-dim: rgba(245, 158, 11, 0.15);
      --green: #10b981;
      --radius: 16px;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      margin: 0;
      padding: env(safe-area-inset-top) 16px env(safe-area-inset-bottom) 16px;
      background-color: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 0 12px 0;
    }

    .brand {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: -0.5px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .brand span {
      background: var(--accent);
      color: #000;
      font-size: 11px;
      font-weight: 800;
      padding: 2px 6px;
      border-radius: 6px;
      letter-spacing: 0.5px;
    }

    .nav-btn {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 8px 12px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }

    .nav-btn.active {
      color: var(--text);
      border-color: var(--accent);
    }

    /* Progress bar */
    .progress {
      display: flex;
      gap: 6px;
      margin-bottom: 20px;
    }

    .progress-step {
      height: 4px;
      flex: 1;
      background: var(--surface);
      border-radius: 4px;
      transition: background 0.3s ease;
    }

    .progress-step.done {
      background: var(--accent);
    }

    main {
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    .step-title {
      font-size: 24px;
      font-weight: 700;
      margin: 0 0 6px 0;
      letter-spacing: -0.5px;
    }

    .step-subtitle {
      font-size: 14px;
      color: var(--text-muted);
      margin: 0 0 20px 0;
    }

    .options-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
    }

    .options-grid.two-col {
      grid-template-columns: 1fr 1fr;
    }

    .option-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
      text-align: left;
      color: var(--text);
      cursor: pointer;
      transition: transform 0.1s ease, border-color 0.2s ease, background 0.2s ease;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .option-card:active {
      transform: scale(0.98);
      background: var(--surface-active);
      border-color: var(--accent);
    }

    .option-icon {
      font-size: 22px;
      margin-bottom: 4px;
    }

    .option-label {
      font-size: 16px;
      font-weight: 600;
    }

    .option-desc {
      font-size: 12px;
      color: var(--text-muted);
      line-height: 1.3;
    }

    /* Result Screen */
    .result-box {
      background: linear-gradient(145deg, #1d1d24 0%, #141418 100%);
      border: 1px solid var(--accent);
      border-radius: 20px;
      padding: 20px;
      margin-bottom: 14px;
    }

    .badge {
      display: inline-block;
      background: var(--accent-dim);
      color: var(--accent);
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      padding: 4px 10px;
      border-radius: 20px;
      margin-bottom: 10px;
    }

    .film-name {
      font-size: 28px;
      font-weight: 800;
      margin: 0 0 4px 0;
      letter-spacing: -0.6px;
    }

    .film-brand {
      font-size: 13px;
      color: var(--text-muted);
      margin-bottom: 14px;
    }

    .film-reason {
      font-size: 15px;
      line-height: 1.5;
      color: #e4e4e9;
      margin: 0 0 18px 0;
    }

    .settings-bar {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      background: rgba(0, 0, 0, 0.35);
      padding: 12px;
      border-radius: 12px;
      border: 1px solid var(--border);
    }

    .setting-item {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .setting-key {
      font-size: 10px;
      text-transform: uppercase;
      color: var(--text-muted);
      letter-spacing: 0.5px;
    }

    .setting-val {
      font-size: 14px;
      font-weight: 700;
      color: var(--accent);
    }

    .alt-box {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
      margin-bottom: 20px;
    }

    .alt-title {
      font-size: 11px;
      text-transform: uppercase;
      color: var(--text-muted);
      letter-spacing: 0.6px;
      margin-bottom: 4px;
    }

    .alt-name {
      font-size: 17px;
      font-weight: 700;
      margin-bottom: 4px;
    }

    .alt-desc {
      font-size: 13px;
      color: var(--text-muted);
      line-height: 1.4;
    }

    .actions-row {
      display: flex;
      gap: 10px;
      margin-top: auto;
      padding-bottom: 12px;
    }

    .btn {
      flex: 1;
      padding: 15px;
      border-radius: 14px;
      font-size: 15px;
      font-weight: 700;
      border: none;
      cursor: pointer;
    }

    .btn-secondary {
      background: var(--surface);
      color: var(--text);
      border: 1px solid var(--border);
    }

    .btn-primary {
      background: var(--accent);
      color: #000;
    }

    /* Catalog view */
    .catalog-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding-bottom: 24px;
    }

    .catalog-item {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px;
    }

    .catalog-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 4px;
    }

    .catalog-name {
      font-weight: 700;
      font-size: 16px;
    }

    .catalog-tag {
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 6px;
      background: var(--surface-active);
      color: var(--text-muted);
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>

  <header>
    <div class="brand" onclick="resetWizard()" style="cursor:pointer;">
      FilmPicker <span>GRK 1.6.4</span>
    </div>
    <button class="nav-btn" id="toggleCatalogBtn" onclick="toggleCatalog()">Wszystkie (30)</button>
  </header>

  <div class="progress" id="progressBar">
    <div class="progress-step" id="p1"></div>
    <div class="progress-step" id="p2"></div>
    <div class="progress-step" id="p3"></div>
  </div>

  <!-- WIZARD VIEW -->
  <main id="wizardView">
    <div id="stepContainer"></div>
  </main>

  <!-- CATALOG VIEW -->
  <main id="catalogView" class="hidden">
    <h2 class="step-title">Baza profili GRKit</h2>
    <p class="step-subtitle">Wszystkie 30 wbudowanych symulacji i ich zastosowanie.</p>
    <div class="catalog-list" id="catalogList"></div>
  </main>

  <script>
    const FILMS = {
      portra400: { name: "Portra 400", brand: "Kodak · Kolor (Negatyw)", tag: "Uniwersalny", desc: "Naturalne odcienie skóry, pastelowe barwy i wysoka tolerancja w trudnym świetle. Król codziennych kadrów." },
      portra160vc: { name: "Portra 160 VC", brand: "Kodak · Kolor (Negatyw)", tag: "Portret / Słońce", desc: "Żywsze kolory i wyższy kontrast niż zwykła Portra, wciąż bezpieczny dla skóry. Świetny w pełnym słońcu." },
      portra800: { name: "Portra 800 (+2)", brand: "Kodak · Kolor (Forsowany)", tag: "Zmierzch / Cień", desc: "Głębokie cienie, bogate ciepłe kolory i mocniejszy kontrast. Idealny na wieczór, w cieniu i we wnętrzach." },
      pro400h: { name: "Pro 400H", brand: "Fujifilm · Kolor (Negatyw)", tag: "Pastel / Zieleń", desc: "Chłodniejsza, zwiewna paleta z pastelowymi zieleniami i błękitami. Doskonały w pochmurny dzień i w zieleni." },
      fuji160c: { name: "Fuji 160C", brand: "Fujifilm · Kolor (Negatyw)", tag: "Ostre słońce", desc: "Niski kontrast i wierne kolory. Łagodzi ostre cienie w pełnym, południowym słońcu." },
      gold200: { name: "Gold 200", brand: "Kodak · Kolor (Negatyw)", tag: "Złota godzina", desc: "Mocno podkreśla złote, żółte i ciepłe tony. Stworzony do złotej godziny, jesieni i wakacyjnych kadrów." },
      ultramax400: { name: "UltraMax 400", brand: "Kodak · Kolor (Negatyw)", tag: "Street / Słońce", desc: "Wysoki kontrast, nasycone błękity i czerwienie. Świetny do dynamicznego street photo w słońcu." },
      c200: { name: "Fujicolor C200", brand: "Fujifilm · Kolor (Negatyw)", tag: "Codzienny", desc: "Czyste, lekko chłodne tony i wyraźne zielenie. Dobry na co dzień, do miasta i przyrody." },
      superia400: { name: "Superia 400", brand: "Fujifilm · Kolor (Negatyw)", tag: "Deszcz / Las", desc: "Głębokie zielenie i fioletowo-magentowe cienie. Świetny w pochmurną pogodę, w lesie i przy jarzeniówkach." },
      vista200: { name: "Agfa Vista 200", brand: "Agfa · Kolor (Negatyw)", tag: "Pochmurno / Kolor", desc: "Żywe czerwienie i pomarańcze przy chłodnych cieniach. Ożywia szare, pochmurne dni na ulicy." },
      velvia100: { name: "Velvia 100", brand: "Fujifilm · Kolor (Slajd)", tag: "Krajobraz", desc: "Ekstremalne nasycenie (zielenie, błękity, magenty) i wysoki kontrast. Klasyk do krajobrazu. Unikaj przy twarzach." },
      provia100f: { name: "Provia 100F", brand: "Fujifilm · Kolor (Slajd)", tag: "Podróże / Natura", desc: "Wzorcowa naturalność slajdu, wysoki kontrast i świetna separacja kolorów bez przesady Velvii." },
      astia100f: { name: "Astia 100F", brand: "Fujifilm · Kolor (Slajd)", tag: "Slajd + Ludzie", desc: "Najbardziej miękki ze slajdów Fuji. Daje głębię diapozytywu, ale zachowuje naturalny wygląd skóry." },
      ektachrome100: { name: "Ektachrome E100", brand: "Kodak · Kolor (Slajd)", tag: "Zima / Architektura", desc: "Chłodne, stalowe błękity i czyste biele. Idealny na zimę, mgłę, góry i modernistyczną architekturę." },
      kodachrome64: { name: "Kodachrome 64", brand: "Kodak · Kolor (Slajd)", tag: "Dokument / Retro", desc: "Ziemiste czerwienie, ciepłe brązy, przygaszona zieleń i smoliste cienie. Kultowy klimat reportażu." },
      precisa100: { name: "Agfa Precisa 100", brand: "Agfa · Kolor (Slajd)", tag: "Miasto / Woda", desc: "Mocny kontrast i chłodne niebiesko-zielone cienie. Dobry do architektury, wody i metalu." },
      vision250d: { name: "Vision3 250D", brand: "Kodak · Kinowy", tag: "Filmowy dzień", desc: "Ogromna plastyczność, miękkie światła i bogate kolory. Idealny do narracyjnego street photo w dzień." },
      vision500t: { name: "Vision3 500T", brand: "Kodak · Kinowy", tag: "Zmierzch / Noc", desc: "Zbalansowany pod światło żarowe. Piękne błękity o zmierzchu i świetne oddanie neonów oraz latarni w nocy." },
      eterna500t: { name: "Eterna 500T", brand: "Fujifilm · Kinowy", tag: "Mgła / Melancholia", desc: "Bardzo niski kontrast, zgaszone kolory i otwarte cienie. Idealny we mgle, deszczu i pochmurne dni." },
      aerocolor: { name: "Aerocolor IV", brand: "Kodak · Lotniczy", tag: "Minimalizm / Lato", desc: "Pastelowe błękity, jasne zielenie i mocne czerwienie. Świetny do minimalizmu, morza i architektury." },
      instax: { name: "Instax", brand: "Fujifilm · Natychmiastowy", tag: "Lifestyle / Impreza", desc: "Wysoki kontrast, cyjanowe cienie i wyblakłe światła. Najlepszy z włączoną ramką Instant." },
      trix400: { name: "Tri-X 400", brand: "Kodak · B&W", tag: "Street B&W", desc: "Ikona fotoreportażu. Mocny, chropowaty kontrast i głębokie czernie do dynamicznej ulicy." },
      trix400red: { name: "Tri-X 400 Red", brand: "Kodak · B&W (Filtr)", tag: "Architektura B&W", desc: "Symulacja czerwonego filtra. Przyciemnia błękitne niebo niemal do czerni i mocno podbija chmury." },
      hp5: { name: "HP5 Plus 400", brand: "Ilford · B&W", tag: "Pochmurno / Reportaż", desc: "Szeroka skala szarości i miękki kontrast. Świetny na pochmurne dni i do zachowania detali w cieniach." },
      tmax400: { name: "T-Max 400", brand: "Kodak · B&W", tag: "Detal / Architektura", desc: "Gładkie przejścia tonalne i wysoki mikro-kontrast. Dobry do architektury i portretów." },
      delta100: { name: "Delta 100", brand: "Ilford · B&W", tag: "Krajobraz B&W", desc: "Wysoka ostrość i czyste, precyzyjne szarości bez agresywnego kontrastu." },
      acros: { name: "Neopan Acros", brand: "Fujifilm · B&W", tag: "Noc / Minimalizm", desc: "Niezwykle głębokie, czyste czernie przy zachowaniu gładkiej skóry. Król nocnego B&W i długich czasów." },
      doublex: { name: "Double-X 5222", brand: "Kodak · B&W Kinowy", tag: "Filmowe B&W", desc: "Srebrzysty, kinowy kontrast z błyszczącymi światłami. Świetny w deszczu, w nocy i w kadrze XPan." },
      xp2: { name: "XP2 Super", brand: "Ilford · B&W (C-41)", tag: "Portret w słońcu", desc: "Kremowe światła i łagodne przejścia. Niemal nie da się na nim przepalić twarzy w ostrym słońcu." }
    };

    const QUESTIONS = [
      {
        id: "mode",
        title: "Kolor czy czerń i biel?",
        subtitle: "Wybierz punkt wyjścia dla dzisiejszego spaceru.",
        twoCol: true,
        options: [
          { val: "color", icon: "🎨", label: "Kolor", desc: "Negatywy, slajdy i taśmy kinowe" },
          { val: "bw", icon: "◐", label: "Czerń i biel", desc: "Klasyczne emulsje srebrowe" }
        ]
      },
      {
        id: "light",
        title: "Jakie masz teraz światło?",
        subtitle: "Warunki oświetleniowe najmocniej wpływają na dobór krzywej.",
        twoCol: false,
        options: [
          { val: "harsh", icon: "☀️", label: "Ostre słońce (środek dnia)", desc: "Mocne cienie, duży kontrast sceny" },
          { val: "golden", icon: "🌅", label: "Złota godzina / Późne popołudnie", desc: "Ciepłe, niskie światło boczne" },
          { val: "overcast", icon: "☁️", label: "Pochmurno / Cień / Las", desc: "Miękkie, rozproszone światło bez cieni" },
          { val: "fog", icon: "🌫️", label: "Mgła / Deszcz / Mżawka", desc: "Niski kontrast, wilgoć w powietrzu" },
          { val: "twilight", icon: "🌆", label: "Zmierzch (Blue Hour)", desc: "Gasnące niebo i pierwsze latarnie" },
          { val: "night", icon: "🌃", label: "Noc / Sztuczne światło", desc: "Neony, latarnie, wnętrza, witryny" }
        ]
      },
      {
        id: "subject",
        title: "Co głównie fotografujesz?",
        subtitle: "Dopasujemy oddanie skóry, zieleni lub kontrastu.",
        twoCol: false,
        options: [
          { val: "people", icon: "👤", label: "Ludzie / Portret / Rodzina", desc: "Priorytet naturalnych odcieni skóry" },
          { val: "street", icon: "🏙️", label: "Street photo / Miasto", desc: "Reportaż, codzienność, gra światła i cienia" },
          { val: "nature", icon: "🌲", label: "Natura / Krajobraz / Zieleń", desc: "Las, woda, otwarte przestrzenie" },
          { val: "arch", icon: "📐", label: "Architektura / Minimalizm", desc: "Geometria, detale, bryły i niebo" }
        ]
      }
    ];

    let state = {
      step: 0,
      answers: {},
      catalogOpen: false
    };

    function getRecommendation(a) {
      const { mode, light, subject } = a;

      // CZERŃ I BIEL
      if (mode === "bw") {
        if (light === "harsh") {
          if (subject === "people") return { main: "xp2", alt: "hp5", ev: "0.0 EV", extra: "Grain: Weak", why: "Ilford XP2 Super ma niezwykle łagodne światła – w ostrym słońcu chroni twarze przed przepaleniem i daje kremowe przejścia tonalne." };
          if (subject === "arch") return { main: "trix400red", alt: "tmax400", ev: "-0.3 EV", extra: "Grain: Medium", why: "Tri-X 400 Red (z czerwonym filtrem) zamieni błękitne niebo w dramatyczną czerń i mocno odetnie bryły budynków." };
          return { main: "trix400", alt: "doublex", ev: "-0.3 EV", extra: "Grain: Strong", why: "W mocnym słońcu Tri-X 400 daje klasyczny, chropowaty kontrast reportażowy z głębokimi cieniami." };
        }
        if (light === "golden") {
          return { main: "doublex", alt: "trix400", ev: "0.0 EV", extra: "Framing: XPan", why: "Niskie, boczne światło wydobędzie srebrzysty, kinowy charakter taśmy Kodak Double-X 5222." };
        }
        if (light === "overcast" || light === "fog") {
          if (subject === "nature" || subject === "arch") return { main: "delta100", alt: "hp5", ev: "+0.3 EV", extra: "Grain: Off", why: "Przy miękkim świetle Ilford Delta 100 zapewni najwyższą ostrość, czystość i precyzyjne przejścia szarości." };
          return { main: "hp5", alt: "tmax400", ev: "+0.3 EV", extra: "Grain: Medium", why: "HP5 Plus 400 ma bardzo elastyczną skalę szarości – w pochmurny dzień nie zgubi detali w cieniach." };
        }
        if (light === "twilight" || light === "night") {
          if (subject === "street") return { main: "doublex", alt: "acros", ev: "-0.7 EV", extra: "Grain: Medium", why: "Kinowy Double-X 5222 pięknie oddaje odbicia latarni na asfalcie i utrzymuje mocny, filmowy kontrast po zmroku." };
          return { main: "acros", alt: "tmax400", ev: "-0.3 EV", extra: "Grain: Off", why: "Neopan Acros słynie z najczystszych, najgłębszych czerni bez szumu – idealny do nocnego minimalizmu i portretów." };
        }
      }

      // KOLOR
      if (light === "harsh") {
        if (subject === "people") return { main: "fuji160c", alt: "portra160vc", ev: "+0.3 EV", extra: "Grain: Weak", why: "Fuji 160C ma niski kontrast, dzięki czemu skutecznie łagodzi ostre cienie na twarzach w pełnym słońcu." };
        if (subject === "nature") return { main: "provia100f", alt: "velvia100", ev: "0.0 EV", extra: "Grain: Off", why: "Provia 100F da głębokie, nasycone kolory natury bez przesadnego zafarbu w ostrym słońcu." };
        if (subject === "arch") return { main: "aerocolor", alt: "ektachrome100", ev: "+0.3 EV", extra: "Grain: Off", why: "Aerocolor IV w pełnym słońcu daje pastelowe błękity i mocne czerwienie – genialne do geometrii i minimalizmu." };
        return { main: "ultramax400", alt: "kodachrome64", ev: "0.0 EV", extra: "Grain: Medium", why: "UltraMax 400 kocha pełne słońce – podbija błękity i czerwienie, nadając ulicy wysoką energię." };
      }

      if (light === "golden") {
        if (subject === "people") return { main: "portra400", alt: "astia100f", ev: "+0.3 EV", extra: "Glow: Bloom", why: "Portra 400 w połączeniu ze złotym światłem daje najbardziej naturalne, ciepłe i miękkie odcienie skóry." };
        if (subject === "nature") return { main: "gold200", alt: "velvia100", ev: "+0.3 EV", extra: "Glow: Bloom", why: "Kodak Gold 200 podczas złotej godziny zamienia liście i trawy w ciepłe, nostalgiczne złoto." };
        return { main: "vision250d", alt: "gold200", ev: "0.0 EV", extra: "Framing: XPan", why: "Kinowa taśma Vision3 250D świetnie radzi sobie z rozpiętością tonalną niskiego słońca, dając miękkie światła." };
      }

      if (light === "overcast") {
        if (subject === "people") return { main: "pro400h", alt: "portra400", ev: "+0.3 EV", extra: "Grain: Weak", why: "Pochmurne niebo to żywioł Fujifilm Pro 400H – uzyskasz jasny, zwiewny look z pastelowymi odcieniami skóry." };

    function render() {
      const container = document.getElementById("stepContainer");
      const p1 = document.getElementById("p1");
      const p2 = document.getElementById("p2");
      const p3 = document.getElementById("p3");

      p1.classList.toggle("done", state.step >= 0);
      p2.classList.toggle("done", state.step >= 1);
      p3.classList.toggle("done", state.step >= 2);

      if (state.step < QUESTIONS.length) {
        const q = QUESTIONS[state.step];
        container.innerHTML = `
          <h1 class="step-title">${q.title}</h1>
          <p class="step-subtitle">${q.subtitle}</p>
          <div class="options-grid ${q.twoCol ? 'two-col' : ''}">
            ${q.options.map(opt => `
              <button class="option-card" onclick="selectOption('${q.id}', '${opt.val}')">
                <div class="option-icon">${opt.icon}</div>
                <div class="option-label">${opt.label}</div>
                <div class="option-desc">${opt.desc}</div>
              </button>
            `).join("")}
          </div>
          ${state.step > 0 ? `
            <div class="actions-row" style="margin-top: 20px;">
              <button class="btn btn-secondary" onclick="prevStep()">← Wstecz</button>
            </div>
          ` : ''}
        `;
      } else {
        const rec = getRecommendation(state.answers);
        const mainFilm = FILMS[rec.main];
        const altFilm = FILMS[rec.alt];

        container.innerHTML = `
          <div class="result-box">
            <div class="badge">Rekomendowany profil</div>
            <h1 class="film-name">${mainFilm.name}</h1>
            <div class="film-brand">${mainFilm.brand}</div>
            <p class="film-reason">${rec.why}</p>
            <div class="settings-bar">
              <div class="setting-item">
                <span class="setting-key">Ekspozycja</span>
                <span class="setting-val">${rec.ev}</span>
              </div>
              <div class="setting-item" style="grid-column: span 2;">
                <span class="setting-key">Dodatek w GRKit</span>
                <span class="setting-val">${rec.extra}</span>
              </div>
            </div>
          </div>

          <div class="alt-box">
            <div class="alt-title">Alternatywa</div>
            <div class="alt-name">${altFilm.name}</div>
            <div class="alt-desc">${altFilm.desc}</div>
          </div>

          <div class="actions-row">
            <button class="btn btn-secondary" onclick="prevStep()">← Zmień</button>
            <button class="btn btn-primary" onclick="resetWizard()">Nowy wybór</button>
          </div>
        `;
      }
    }

    function selectOption(key, val) {
      state.answers[key] = val;
      state.step++;
      render();
      window.scrollTo(0, 0);
    }

    function prevStep() {
      if (state.step > 0) {
        state.step--;
        render();
      }
    }

    function resetWizard() {
      state.step = 0;
      state.answers = {};
      if (state.catalogOpen) toggleCatalog();
      render();
    }

    function toggleCatalog() {
      state.catalogOpen = !state.catalogOpen;
      const wizardView = document.getElementById("wizardView");
      const catalogView = document.getElementById("catalogView");
      const progressBar = document.getElementById("progressBar");
      const btn = document.getElementById("toggleCatalogBtn");

      if (state.catalogOpen) {
        wizardView.classList.add("hidden");
        progressBar.classList.add("hidden");
        catalogView.classList.remove("hidden");
        btn.textContent = "← Kreator";
        btn.classList.add("active");
        renderCatalog();
      } else {
        catalogView.classList.add("hidden");
        wizardView.classList.remove("hidden");
        progressBar.classList.remove("hidden");
        btn.textContent = "Wszystkie (30)";
        btn.classList.remove("active");
      }
    }

    function renderCatalog() {
      const list = document.getElementById("catalogList");
      list.innerHTML = Object.values(FILMS).map(f => `
        <div class="catalog-item">
          <div class="catalog-header">
            <span class="catalog-name">${f.name}</span>
            <span class="catalog-tag">${f.tag}</span>
          </div>
          <div style="font-size: 11px; color: var(--accent); margin-bottom: 6px;">${f.brand}</div>
          <div style="font-size: 13px; color: var(--text-muted); line-height: 1.4;">${f.desc}</div>
        </div>
      `).join("");
    }
