<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>FilmPicker · GRKit</title>
  
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="FilmPicker">
  <meta name="theme-color" content="#0d0d0f">
  
  <link rel="manifest" href="./manifest.json">
  <link rel="apple-touch-icon" href="./icon.svg">
  <link rel="icon" type="image/svg+xml" href="./icon.svg">

  <style>
    :root {
      --bg: #0d0d0f;
      --surface: #18181c;
      --surface-active: #24242b;
      --border: #2c2c35;
      --text: #f4f4f6;
      --text-muted: #9898a6;
      --accent: #f59e0b;
      --accent-dim: rgba(245, 158, 11, 0.15);
      --radius: 16px;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      margin: 0;
      padding: env(safe-area-inset-top) 16px env(safe-area-inset-bottom) 16px;
      background-color: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 0 12px 0;
    }

    .brand {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: -0.5px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .brand span {
      background: var(--accent);
      color: #000;
      font-size: 11px;
      font-weight: 800;
      padding: 2px 6px;
      border-radius: 6px;
      letter-spacing: 0.5px;
    }

    .nav-btn {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 8px 12px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }

    .nav-btn.active {
      color: var(--text);
      border-color: var(--accent);
    }

    .progress {
      display: flex;
      gap: 6px;
      margin-bottom: 20px;
    }

    .progress-step {
      height: 4px;
      flex: 1;
      background: var(--surface);
      border-radius: 4px;
      transition: background 0.3s ease;
    }

    .progress-step.done {
      background: var(--accent);
    }

    main {
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    .step-title {
      font-size: 24px;
      font-weight: 700;
      margin: 0 0 6px 0;
      letter-spacing: -0.5px;
    }

    .step-subtitle {
      font-size: 14px;
      color: var(--text-muted);
      margin: 0 0 20px 0;
    }

    .options-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
    }

    .options-grid.two-col {
      grid-template-columns: 1fr 1fr;
    }

    .option-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
      text-align: left;
      color: var(--text);
      cursor: pointer;
      transition: transform 0.1s ease, border-color 0.2s ease, background 0.2s ease;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .option-card:active {
      transform: scale(0.98);
      background: var(--surface-active);
      border-color: var(--accent);
    }

    .option-icon {
      font-size: 22px;
      margin-bottom: 4px;
    }

    .option-label {
      font-size: 16px;
      font-weight: 600;
    }

    .option-desc {
      font-size: 12px;
      color: var(--text-muted);
      line-height: 1.3;
    }

    .result-box {
      background: linear-gradient(145deg, #1d1d24 0%, #141418 100%);
      border: 1px solid var(--accent);
      border-radius: 20px;
      padding: 20px;
      margin-bottom: 14px;
    }

    .badge {
      display: inline-block;
      background: var(--accent-dim);
      color: var(--accent);
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      padding: 4px 10px;
      border-radius: 20px;
      margin-bottom: 10px;
    }

    .film-name {
      font-size: 28px;
      font-weight: 800;
      margin: 0 0 4px 0;
      letter-spacing: -0.6px;
    }

    .film-brand {
      font-size: 13px;
      color: var(--text-muted);
      margin-bottom: 14px;
    }

    .film-reason {
      font-size: 15px;
      line-height: 1.5;
      color: #e4e4e9;
      margin: 0 0 18px 0;
    }

    .settings-bar {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      background: rgba(0, 0, 0, 0.35);
      padding: 12px;
      border-radius: 12px;
      border: 1px solid var(--border);
    }

    .setting-item {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .setting-key {
      font-size: 10px;
      text-transform: uppercase;
      color: var(--text-muted);
      letter-spacing: 0.5px;
    }

    .setting-val {
      font-size: 14px;
      font-weight: 700;
      color: var(--accent);
    }

    .alt-box {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
      margin-bottom: 20px;
    }

    .alt-title {
      font-size: 11px;
      text-transform: uppercase;
      color: var(--text-muted);
      letter-spacing: 0.6px;
      margin-bottom: 4px;
    }

    .alt-name {
      font-size: 17px;
      font-weight: 700;
      margin-bottom: 4px;
    }

    .alt-desc {
      font-size: 13px;
      color: var(--text-muted);
      line-height: 1.4;
    }

    .actions-row {
      display: flex;
      gap: 10px;
      margin-top: auto;
      padding-bottom: 12px;
    }

    .btn {
      flex: 1;
      padding: 15px;
      border-radius: 14px;
      font-size: 15px;
      font-weight: 700;
      border: none;
      cursor: pointer;
    }

    .btn-secondary {
      background: var(--surface);
      color: var(--text);
      border: 1px solid var(--border);
    }

    .btn-primary {
      background: var(--accent);
      color: #000;
    }

    .catalog-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding-bottom: 24px;
    }

    .catalog-item {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px;
    }

    .catalog-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 4px;
    }

    .catalog-name {
      font-weight: 700;
      font-size: 16px;
    }

    .catalog-tag {
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 6px;
      background: var(--surface-active);
      color: var(--text-muted);
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>

  <header>
    <div class="brand" id="brandBtn" style="cursor:pointer;">
      FilmPicker <span>GRK 1.6.4</span>
    </div>
    <button class="nav-btn" id="toggleCatalogBtn">Wszystkie (29)</button>
  </header>

  <div class="progress" id="progressBar">
    <div class="progress-step done" id="p1"></div>
    <div class="progress-step" id="p2"></div>
    <div class="progress-step" id="p3"></div>
  </div>

  <main id="wizardView">
    <div id="stepContainer"></div>
  </main>

  <main id="catalogView" class="hidden">
    <h2 class="step-title">Baza profili GRKit</h2>
    <p class="step-subtitle">Wbudowane symulacje i ich zastosowanie.</p>
    <div class="catalog-list" id="catalogList"></div>
  </main>
